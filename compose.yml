services:
  mariadb:
    image: mariadb
    container_name: unstable-fusion-mariadb
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: my-secret-pw
      MARIADB_DATABASE: sd_api
      MARIADB_USER: sduser
      MARIADB_PASSWORD: sdpassword
    ports:
      - '3306:3306'
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 3

  app:
    build: .
    container_name: unstable-fusion-app
    restart: always
    environment:
      DATABASE_URL: mysql+pymysql://root:my-secret-pw@mariadb:3306/sd_api
      IMAGES_DIR: /app/generated_images
      JWT_SECRET: your-secure-jwt-secret-key-change-this-in-production
      JWT_ALGORITHM: HS256
      JWT_EXP_SECONDS: 21600
      MAX_CONCURRENT: 2
    ports:
      - '3001:3001'
    volumes:
      - images_data:/app/generated_images
    depends_on:
      mariadb:
        condition: service_healthy

volumes:
  mariadb_data:
  images_data: